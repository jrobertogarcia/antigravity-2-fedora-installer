name: Check Upstream Updates

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [app, ide]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check for updates and apply changes
        id: check
        run: |
          python3 .github/scripts/update-checker.py --target ${{ matrix.target }} --apply

      - name: Create Pull Request
        if: steps.check.outputs.update_needed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: ${{ steps.check.outputs.pr_title }}
          title: ${{ steps.check.outputs.pr_title }}
          body: |
            Automated upstream release update for **${{ steps.check.outputs.target_name }}** to version **${{ steps.check.outputs.latest_version }}** (Execution ID: `${{ steps.check.outputs.execution_id }}`).

            ### Updated Components
            - Spec: `${{ matrix.target == 'app' && 'antigravity2.spec' || 'antigravity2-ide.spec' }}`
            - Installer script: `install.sh`
            - Documentation: `README.md`

            Auto-generated by GitHub Actions workflow.
          branch: ${{ steps.check.outputs.branch_name }}
          delete-branch: true
          labels: |
            dependencies
            automated pr
