name: Check Upstream Updates

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Check for updates and apply changes
        id: check
        run: |
          python3 .github/scripts/update-checker.py --target all --apply

      - name: Create Pull Request
        if: steps.check.outputs.update_needed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: ${{ steps.check.outputs.pr_title }}
          title: ${{ steps.check.outputs.pr_title }}
          body: ${{ steps.check.outputs.pr_body }}
          branch: ${{ steps.check.outputs.branch_name }}
          delete-branch: true
          labels: |
            dependencies
            automated pr
